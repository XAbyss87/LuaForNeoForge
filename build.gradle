plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
}

version = mod_version
group = mod_group_id

jar {
    manifest {
        attributes(
                'FMLModType': 'LIBRARY',
                'Implementation-Version': project.version.toString()
        )
    }
}

repositories {
    mavenLocal()
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup "thedarkcolour" }
    }
}

base {
    archivesName = mod_id
}

kotlin.jvmToolchain(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            jvmArguments.add("--enable-native-access=com.sun.jna")

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG

            jvmArguments.addAll(
                    "--enable-native-access=luaforneoforge",
                    "-Dluajava.native.path=liblua5564.so"
            )
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main {
    kotlin.srcDir 'src/main/code'
    resources.srcDir 'src/generated/resources'
}

configurations { bundledLuaRuntime }
dependencies {
    implementation 'thedarkcolour:kotlinforforge-neoforge:5.13.0'
    compileOnly 'party.iroiro.luajava:luajava:4.1.0'
    compileOnly 'party.iroiro.luajava:lua55:4.1.0'

    // Keep LuaJava classes and native libraries in the mod's Java module.
    bundledLuaRuntime 'party.iroiro.luajava:luajava:4.1.0'
    bundledLuaRuntime 'party.iroiro.luajava:lua55:4.1.0'
    bundledLuaRuntime 'party.iroiro.luajava:lua55-platform:4.1.0:natives-desktop'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Override with -PprismModsDirectory or a setting in the user Gradle properties.
def prismDataDirectory = providers.environmentVariable('XDG_DATA_HOME')
        .orElse(providers.systemProperty('user.home').map { home -> "${home}/.local/share" })
def prismModsDirectory = providers.gradleProperty('prismModsDirectory')
        .orElse(prismDataDirectory.map { data -> "${data}/PrismLauncher/instances/LuaForNeoForgeDev/minecraft/mods" })

tasks.register('deployMod', Copy) {
    group = 'deployment'
    description = 'Builds and deploys the mod to Prism Launcher'

    dependsOn tasks.named('build')

    from tasks.named('jar', Jar).flatMap { it.archiveFile }

    into prismModsDirectory
    rename { 'LuaForNeoForge.jar' }
}

def luaTestJar = tasks.register('luaTestJar', Jar) {
    group = 'build'
    description = 'Packages the Lua test mod as a JAR'

    archiveFileName = 'luatest.jar'
    from layout.projectDirectory.dir('luatest')
}

tasks.register('deployLuaTest', Copy) {
    group = 'deployment'
    description = 'Builds and deploys the Lua test mod to Prism Launcher'

    from luaTestJar.flatMap { it.archiveFile }
    into prismModsDirectory
}

def resourceNamespace = project.mod_id
tasks.named('processResources', ProcessResources) {
    eachFile { details ->
        if (details.path == "assets/${resourceNamespace}/lang/en_us.json" && details.file.length() == 0) {
            details.exclude()
        }
    }
    from({ configurations.bundledLuaRuntime.collect { zipTree(it) } }) {
        include 'party/iroiro/luajava/**'
        include 'com/badlogic/gdx/jnigen/**'
        include '*.so', '*.dll', '*.dylib'
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    def replaceProperties = [minecraft_version_range: minecraft_version_range,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = layout.projectDirectory.dir('repo').asFile.toURI()
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
